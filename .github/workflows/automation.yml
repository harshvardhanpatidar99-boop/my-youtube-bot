name: YouTube Automation Pipeline

on:
  schedule:
    # Runs 3x/day, spaced out -- covers Shorts cadence and lets long-form
    # slot in whenever the queue serves one up. Cron is UTC.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}   # lets you also trigger a run manually from the Actions tab

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME || secrets.INSTA_ID || secrets.INSTAGRAM_ID || secrets.INSTA_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD || secrets.INSTA_PASSWORD }}
        run: python orchestrator.py
      - name: Commit updated state files
        run: |
          git config user.name "channel-bot"
          git config user.email "actions@github.com"
          git add data/current_niche.json data/content_queue.json data/upload_log.json data/instagram_upload_log.json || true
          git diff --cached --quiet || git commit -m "Automated content run [skip ci]"
          git push
